name: Deploy to Github Pages

# run when a commit is pushed to "source" branch
on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # checkout to the commit that has been pushed
    - uses: actions/checkout@v4

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true

    # Hugo 0.153+ requires the standalone Dart Sass binary (npm sass is not enough).
    # GITHUB_PATH only applies to later steps, so verify with the absolute path here.
    - name: Install Dart Sass
      run: |
        DART_SASS_VERSION=1.94.0
        curl -fsSL -o dart-sass.tar.gz \
          "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        tar -xzf dart-sass.tar.gz
        echo "$GITHUB_WORKSPACE/dart-sass" >> "$GITHUB_PATH"
        rm dart-sass.tar.gz
        "$GITHUB_WORKSPACE/dart-sass/sass" --embedded --version

    - name: Update Hugo Modules
      run: hugo mod tidy

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install node modules
      run: |
        hugo mod npm pack
        npm install

    - name: Build
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
      run: hugo --minify

    # push the generated content into the `gh-pages` branch.
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
